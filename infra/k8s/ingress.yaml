apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parseforge-ingress
  namespace: parseforge
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: "nginx"
    # Enable proxy buffering off
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: parseforge.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8501
